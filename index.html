<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label Stapeldruck – Wego Systembaustoffe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a0072">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f0f0f0;min-height:100vh;}
.topbar{background:#4a0072;color:white;padding:12px 20px;font-size:1.1em;font-weight:bold;display:flex;align-items:center;gap:10px;}
.main{max-width:700px;margin:24px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px;}
.card{background:white;border-radius:6px;border:1px solid #ddd;padding:16px;}
.card-title{font-size:.78em;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;color:#666;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #eee;}
.format-list{display:flex;flex-direction:column;gap:6px;}
.format-list label{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-weight:bold;font-size:.93em;}
.format-list input[type=radio]{accent-color:#4a0072;width:16px;height:16px;}
.info-box{background:#f3eaff;border:1px solid #c9a0e8;border-radius:5px;padding:14px;font-size:.95em;color:#3a0060;}
.info-box strong{display:block;font-size:1.3em;margin-bottom:4px;}
.status{padding:8px 12px;border-radius:4px;font-size:.88em;display:none;}
.status.ok{display:block;background:#d4edda;color:#155724;}
.status.err{display:block;background:#f8d7da;color:#721c24;}
.status.inf{display:block;background:#d1ecf1;color:#0c5460;}
.status.warn{display:block;background:#fff3cd;color:#856404;}
.btn{padding:10px 22px;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:bold;transition:background .15s;}
.btn-print{background:#4a0072;color:white;font-size:16px;padding:13px 32px;}
.btn-print:hover{background:#6a00aa;}
.btn-print:disabled{background:#aaa;cursor:not-allowed;}
.btn-cancel{background:#cc2200;color:white;padding:10px 20px;display:none;}
.btn-cancel:hover{background:#ee3300;}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.progress-wrap{background:#e8e8e8;border-radius:4px;height:18px;overflow:hidden;margin-top:10px;display:none;}
.progress-bar{height:100%;background:#4a0072;width:0%;transition:width .3s;border-radius:4px;}
.progress-txt{font-size:.82em;color:#555;margin-top:4px;display:none;}
.log{background:#f7f7f7;border:1px solid #ddd;border-radius:4px;padding:10px;max-height:160px;overflow-y:auto;font-size:.82em;font-family:monospace;color:#444;display:none;}
.log.visible{display:block;}
.warn-box{background:#fff3cd;border:1px solid #ffc107;border-radius:5px;padding:12px;font-size:.9em;color:#7a5c00;display:none;}
.warn-box.visible{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="topbar">📦 Label Stapeldruck – Wego Systembaustoffe</div>
<div class="main">
  <div class="card">
    <div class="card-title">Format</div>
    <div class="format-list">
      <label><input type="radio" name="fmt" value="klein" checked> Klein – 57 × 31 mm &nbsp;(Zebra ZD421)</label>
      <label><input type="radio" name="fmt" value="mittel"> Mittel – 210 × 90 mm &nbsp;(Laserdrucker)</label>
      <label><input type="radio" name="fmt" value="gross"> Groß – A5 210 × 148 mm &nbsp;(Laserdrucker)</label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Artikeldaten</div>
    <div class="status" id="load-status"></div>
    <div class="info-box" id="info-box" style="display:none;">
      <strong id="art-count">0 Artikel</strong>
      <span id="art-detail"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Stapeldruck</div>
    <div class="warn-box" id="warn-box">
      ⚠️ <span id="warn-txt"></span>
      <button class="btn btn-print" id="btn-confirm" onclick="startPrint()">Ja, jetzt drucken</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-print" id="btn-start" onclick="confirmPrint()" disabled>🖨 Alle Artikel drucken</button>
      <button class="btn btn-cancel" id="btn-cancel" onclick="cancelPrint()">✕ Abbrechen</button>
    </div>
    <div class="progress-wrap" id="prog-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="progress-txt" id="prog-txt"></div>
    <div class="status" id="print-status"></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
var FMT={
  klein: {mmW:57,   mmH:31,    padMm:2, qrMm:20, artShare:0.30, wrap:true},
  mittel:{mmW:210,  mmH:90,    padMm:6, qrMm:40},
  gross: {mmW:210,  mmH:148.5, padMm:8, qrMm:50}
};
var ART_SHARE=0.40, LH_ART=1.05, LH_DSC=1.25, SAFE=0.97, MIN_FS=1.2;

var artikel=[],cancelled=false;

/* ---------- Textbreiten-Messung via Canvas (aufloesungsunabhaengig) ---------- */
var _cv=document.createElement('canvas'),_cx=_cv.getContext('2d'),_wc={};
function widthRatio(txt,bold){
  var key=(bold?'b|':'n|')+txt;
  if(_wc[key]!==undefined)return _wc[key];
  _cx.font=(bold?'bold ':'')+'100px Arial, Helvetica, sans-serif';
  var v=_cx.measureText(String(txt)).width/100;
  _wc[key]=v;
  return v;
}

/* Zaehlt die Zeilen, die der Browser beim Umbruch an Wortgrenzen tatsaechlich
   erzeugt - die frueher benutzte Schaetzung ueber die Gesamtbreite lag zu niedrig. */
function wrapLineCount(txt,fs,maxW){
  var words=String(txt).split(/\s+/).filter(Boolean);
  if(!words.length)return 1;
  var lines=0,cur='';
  for(var i=0;i<words.length;i++){
    var w=words[i];
    var wW=widthRatio(w,false)*fs;
    if(wW>maxW){                       // Einzelwort breiter als die Spalte
      if(cur){lines++;cur='';}
      lines+=Math.ceil(wW/maxW);
      continue;
    }
    var test=cur?cur+' '+w:w;
    if(widthRatio(test,false)*fs<=maxW){cur=test;}
    else{lines++;cur=w;}
  }
  if(cur)lines++;
  return Math.max(1,lines);
}

function descHeight(descs,fs,maxW){
  var h=0;
  for(var i=0;i<descs.length;i++)h+=wrapLineCount(descs[i],fs,maxW)*fs*LH_DSC;
  return h;
}

/* Layout + Schriftgroessen in Millimetern - unabhaengig von Fenstergroesse. */
function calcLayout(a,f){
  var gap=f.padMm/2;
  var dvd=0.3;
  var reserve=f.wrap?0.8:1.5;
  var txtW=f.mmW-2*f.padMm-f.qrMm-2*gap-dvd;
  var budget=txtW-reserve;
  var availH=f.mmH-2*f.padMm;
  var descs=[a.z1,a.z2,a.z3].filter(Boolean);
  var share=f.artShare||ART_SHARE;

  var rA=widthRatio(a.nr,true);
  var artFs=Math.min((availH*share)/LH_ART, rA>0?budget/rA:availH*share)*SAFE;
  var artH=artFs*LH_ART;

  var dscFs=0;
  if(descs.length){
    var room=availH-artH-(f.wrap?0.4:0);
    if(room<1)room=1;
    if(f.wrap){
      /* groesste Schrift suchen, bei der alle umgebrochenen Zeilen in die Hoehe passen */
      var lo=MIN_FS, hi=room/LH_DSC;
      if(hi<lo)hi=lo;
      for(var it=0;it<18;it++){
        var mid=(lo+hi)/2;
        if(descHeight(descs,mid,budget)<=room)lo=mid; else hi=mid;
      }
      dscFs=Math.max(MIN_FS,lo*0.98);
    }else{
      dscFs=(room/descs.length)/LH_DSC;
      descs.forEach(function(t){var r=widthRatio(t,false);if(r>0)dscFs=Math.min(dscFs,budget/r);});
      dscFs*=SAFE;
    }
  }
  return {gap:gap,dvd:dvd,txtW:txtW,availH:availH,descs:descs,artFs:artFs,dscFs:dscFs,wrap:!!f.wrap};
}

async function loadData(){
  setSt('load-status','Lade Artikeldaten…','inf');
  try{
    var res=await fetch('./data/artikel.xlsx');
    if(!res.ok)throw new Error('HTTP '+res.status);
    var buf=await res.arrayBuffer();
    var wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    var ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    artikel=[];
    for(var i=1;i<rows.length;i++){
      var nr=String(rows[i][0]||'').trim();
      if(!nr)continue;
      artikel.push({nr:nr,z1:String(rows[i][1]||'').trim(),z2:String(rows[i][2]||'').trim(),z3:String(rows[i][3]||'').trim()});
    }
    var n=artikel.length;
    setSt('load-status','✔ '+n.toLocaleString('de-DE')+' Artikel geladen','ok');
    document.getElementById('info-box').style.display='block';
    document.getElementById('art-count').textContent=n.toLocaleString('de-DE')+' Artikel';
    document.getElementById('art-detail').textContent='Alle Artikel werden in einem einzigen Druckjob gedruckt.';
    document.getElementById('btn-start').disabled=false;
  }catch(e){setSt('load-status','Fehler: '+e.message,'err');}
}

function confirmPrint(){
  var n=artikel.length;
  document.getElementById('warn-txt').textContent='Es werden '+n.toLocaleString('de-DE')+' Etiketten in einem Druckjob gesendet. Bitte Drucker und Format prüfen.';
  document.getElementById('warn-box').className='warn-box visible';
  document.getElementById('btn-start').style.display='none';
}

function cancelPrint(){
  cancelled=true;
  document.getElementById('btn-cancel').style.display='none';
  setSt('print-status','Abgebrochen.','warn');
  document.getElementById('prog-wrap').style.display='none';
  document.getElementById('prog-txt').style.display='none';
  document.getElementById('btn-start').style.display='';
  document.getElementById('btn-start').disabled=false;
  document.getElementById('warn-box').className='warn-box';
}

async function startPrint(){
  document.getElementById('warn-box').className='warn-box';
  document.getElementById('btn-start').style.display='none';
  document.getElementById('btn-cancel').style.display='';
  document.getElementById('prog-wrap').style.display='block';
  document.getElementById('prog-txt').style.display='block';
  document.getElementById('log').className='log visible';
  setSt('print-status','Generiere Labels…','inf');
  cancelled=false;
  clearLog();

  var fkey=document.querySelector('input[name="fmt"]:checked').value;
  var f=FMT[fkey];
  var isKlein=(fkey==='klein');
  var total=artikel.length;
  var errors=[];

  // QR-Codes als Data-URLs vorberechnen (off-screen)
  var qrDataUrls=[];
  var tmpDiv=document.createElement('div');
  tmpDiv.style.cssText='position:absolute;left:-9999px;top:-9999px;';
  document.body.appendChild(tmpDiv);

  for(var i=0;i<total;i++){
    if(cancelled)break;
    var a=artikel[i];
    try{
      tmpDiv.innerHTML='';
      new QRCode(tmpDiv,{text:a.nr,width:300,height:300,correctLevel:QRCode.CorrectLevel.M});
      await new Promise(function(r){setTimeout(r,30);});
      var canvas=tmpDiv.querySelector('canvas');
      qrDataUrls.push(canvas?canvas.toDataURL('image/png'):'');
    }catch(e){
      qrDataUrls.push('');
      errors.push('QR-Fehler '+a.nr+': '+e.message);
      addLog('⚠ QR-Fehler: '+a.nr);
    }
    setProgress(Math.round((i+1)/total*50),'QR-Codes: '+(i+1)+'/'+total);
  }
  document.body.removeChild(tmpDiv);

  if(cancelled){return;}

  setProgress(50,'Erstelle Druckdokument…');
  addLog('Generiere Druckdokument…');

  // Druckseiten zusammenbauen - Schriftgroessen je Artikel in mm berechnet
  var pages='';
  var L0=null;
  for(var i=0;i<total;i++){
    if(cancelled)break;
    var a=artikel[i];
    var L=calcLayout(a,f);
    if(!L0)L0=L;
    var qrSrc=qrDataUrls[i]||'';
    var dHtml=L.descs.map(function(d){return '<div class="dsc" style="font-size:'+L.dscFs.toFixed(2)+'mm">'+hEsc(d)+'</div>';}).join('');
    var isLast=(i===total-1);
    pages+='<div class="page"'+(isLast?'':' style="page-break-after:always"')+'>'
      +'<div class="wrap">'
      +'<div class="qsec">'+(qrSrc?'<img src="'+qrSrc+'" alt="">':'')+'</div>'
      +'<div class="dvd"></div>'
      +'<div class="txt">'
      +'<div class="art" style="font-size:'+L.artFs.toFixed(2)+'mm">'+hEsc(a.nr)+'</div>'+dHtml
      +'</div></div>'
      +(isKlein?'':'<div class="brd"></div>')
      +'</div>';
    if(i%50===0){
      setProgress(50+Math.round((i+1)/total*40),'Seiten: '+(i+1)+'/'+total);
      await new Promise(function(r){setTimeout(r,0);});
    }
  }

  if(cancelled)return;

  var pageW=isKlein?f.mmW+'mm':'210mm';
  var pageH=isKlein?f.mmH+'mm':'297mm';
  var css=[
    '*{box-sizing:border-box;margin:0;padding:0;}',
    '@page{size:'+pageW+' '+pageH+';margin:0;}',
    'html,body{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}',
    '.page{position:relative;width:'+pageW+';height:'+pageH+';overflow:hidden;}',
    '.wrap{position:absolute;top:0;left:0;width:'+f.mmW+'mm;height:'+f.mmH+'mm;display:flex;align-items:center;padding:'+f.padMm+'mm;background:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}',
    '.qsec{width:'+f.qrMm+'mm;height:'+f.qrMm+'mm;flex:0 0 '+f.qrMm+'mm;overflow:hidden;}',
    '.qsec img{width:'+f.qrMm+'mm;height:'+f.qrMm+'mm;display:block;}',
    '.dvd{width:'+L0.dvd+'mm;align-self:stretch;background:#999;margin:0 '+L0.gap+'mm;flex:0 0 auto;}',
    '.txt{flex:1 1 auto;min-width:0;max-height:'+(f.mmH-2*f.padMm).toFixed(2)+'mm;overflow:hidden;}',
    '.art{font-weight:bold;line-height:'+LH_ART+';white-space:nowrap;}',
    '.dsc{line-height:'+LH_DSC+';color:#222;'
      +(L0.wrap?'white-space:normal;overflow-wrap:break-word;':'white-space:nowrap;')+'}',
    '.brd{position:absolute;top:0;left:0;width:'+f.mmW+'mm;height:'+f.mmH+'mm;border:.3mm solid #bbb;pointer-events:none;}'
  ].join('\n');

  var html='<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Etiketten</title><style>'
    +css+'</style></head><body>'+pages+'</body></html>';

  setProgress(95,'Öffne Druckfenster…');
  var w=window.open('','_blank');
  if(!w){
    setSt('print-status','Pop-up blockiert – bitte im Browser erlauben.','err');
    document.getElementById('btn-cancel').style.display='none';
    document.getElementById('btn-start').style.display='';
    document.getElementById('btn-start').disabled=false;
    return;
  }
  w.document.open();w.document.write(html);w.document.close();
  setTimeout(function(){
    try{w.focus();w.print();}catch(e){}
  },800);

  setProgress(100,'Fertig!');
  setSt('print-status','✔ '+total.toLocaleString('de-DE')+' Etiketten an Drucker gesendet.'+(errors.length?' ('+errors.length+' Fehler)':''),'ok');
  addLog('✔ Druckjob gesendet: '+total+' Etiketten'+(errors.length?' | '+errors.length+' Fehler':''));
  document.getElementById('btn-cancel').style.display='none';
  document.getElementById('btn-start').style.display='';
  document.getElementById('btn-start').disabled=false;
  document.getElementById('warn-box').className='warn-box';
}

function setProgress(pct,txt){
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=txt;
}
function setSt(id,msg,type){var el=document.getElementById(id);el.textContent=msg;el.className='status '+type;}
function addLog(msg){var l=document.getElementById('log');l.innerHTML+=msg+'<br>';l.scrollTop=l.scrollHeight;}
function clearLog(){document.getElementById('log').innerHTML='';}
function hEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

loadData();
if('serviceWorker'in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
}
</script>
</body>
</html>
